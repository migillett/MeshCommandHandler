[project]
name = "MeshCommandHandler"
version = "0.2.2"
description = "A package to handle commands via text messages"
readme = "README.md"
authors = [
    { name = "Michael Gillett" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.4",
    "pytest>=9.2.0",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
log_cli = true
log_cli_level = "DEBUG"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
